<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — My Account</title>
    <style>
        body { font-family: -apple-system, Arial, sans-serif; background: #0f172a; color: #e2e8f0;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 32px; border-radius: 12px; width: 100%; max-width: 380px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h1 { font-size: 20px; margin-bottom: 4px; }
        p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #cbd5e1; }
        input { width: 100%; padding: 10px 12px; margin-bottom: 16px; border-radius: 8px;
                border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px;
                box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #22c55e;
                 color: #052e16; font-weight: 600; font-size: 15px; cursor: pointer; }
        button:hover { background: #16a34a; }
        .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
        .msg.error { background: #450a0a; color: #fca5a5; }
        .msg.success { background: #052e16; color: #86efac; }
        a.reg-link { display: block; text-align: center; color: #7dd3fc; font-size: 13px;
                     text-decoration: none; margin-top: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Log in to your account</h1>
        <p class="sub">Check your trial status or top up your plan.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="msg {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Log In</button>
        </form>
        <a class="reg-link" href="{% url 'billing:register' %}">Don't have an account? Start a free 7-day trial</a>
    </div>
</body>
</html>
